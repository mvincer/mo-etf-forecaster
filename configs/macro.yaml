# FRED fast (daily/weekly, revision-light) and ALFRED slow (vintage, revision-heavy) series.

fred_fast:
  DGS3MO:        {label: us_3m,        freq: d}
  DGS2:          {label: us_2y,        freq: d}
  DGS10:         {label: us_10y,       freq: d}
  T10Y2Y:        {label: curve_10_2,   freq: d}
  T10Y3M:        {label: curve_10_3m,  freq: d}
  DFII10:        {label: real_10y,     freq: d}
  T10YIE:        {label: breakeven_10, freq: d}
  BAMLH0A0HYM2:  {label: hy_oas,       freq: d}
  BAMLC0A0CM:    {label: ig_oas,       freq: d}
  DTWEXBGS:      {label: dollar_broad, freq: d}
  DCOILWTICO:    {label: wti,          freq: d}
  NFCI:          {label: nfci,         freq: w}
  WALCL:         {label: fed_bs,       freq: w}
  SOFR:          {label: sofr,         freq: d}

# ALFRED vintages. pub_lag_days = conservative fallback shift (calendar days after the
# observation period END before the value was first publicly known) used when the vintage
# API is unavailable for a stretch.
alfred_slow:
  CPIAUCSL:     {label: cpi,          freq: m, pub_lag_days: 45}
  CPILFESL:     {label: core_cpi,     freq: m, pub_lag_days: 45}
  PCEPI:        {label: pce,          freq: m, pub_lag_days: 60}
  PCEPILFE:     {label: core_pce,     freq: m, pub_lag_days: 60}
  MICH:         {label: infl_exp,     freq: m, pub_lag_days: 45}
  INDPRO:       {label: indpro,       freq: m, pub_lag_days: 45}
  IPMAN:        {label: ip_manuf,     freq: m, pub_lag_days: 45}
  TCU:          {label: cap_util,     freq: m, pub_lag_days: 45}
  NEWORDER:     {label: core_capgoods, freq: m, pub_lag_days: 55}
  HOUST:        {label: housing_starts, freq: m, pub_lag_days: 48}
  PERMIT:       {label: permits,      freq: m, pub_lag_days: 48}
  UNRATE:       {label: unrate,       freq: m, pub_lag_days: 35}
  U6RATE:       {label: u6,           freq: m, pub_lag_days: 35}
  PAYEMS:       {label: payrolls,     freq: m, pub_lag_days: 35}
  ICSA:         {label: claims,       freq: w, pub_lag_days: 5}
  CCSA:         {label: cont_claims,  freq: w, pub_lag_days: 12}
  SAHMREALTIME: {label: sahm,         freq: m, pub_lag_days: 35}
  M2SL:         {label: m2,           freq: m, pub_lag_days: 55}
  WM2NS:        {label: m2_weekly,    freq: w, pub_lag_days: 14}
  M2REAL:       {label: m2_real,      freq: m, pub_lag_days: 55}
  GDPC1:        {label: gdp,          freq: q, pub_lag_days: 60}
  UMCSENT:      {label: umich,        freq: m, pub_lag_days: 30}
  USREC:        {label: recession,    freq: m, pub_lag_days: 400}   # NBER dates announced ~1y late
  CP:           {label: corp_profits, freq: q, pub_lag_days: 90}

shiller:
  url: "https://img1.wsimg.com/blobby/go/e5e77e0b-59d1-44d9-ab25-4763ac982e53/downloads/ie_data.xls"
  fallback_url: "http://www.econ.yale.edu/~shiller/data/ie_data.xls"
