# Default hyperparameters (fast mode) and Optuna search spaces (full mode).

defaults:
  logistic_l1:   {C: 0.1}
  logistic_l2:   {C: 1.0}
  elastic_net:   {alpha: 0.001, l1_ratio: 0.5}
  lightgbm:      {n_estimators: 300, learning_rate: 0.03, num_leaves: 31, min_child_samples: 40,
                  subsample: 0.8, colsample_bytree: 0.7, reg_lambda: 1.0}
  xgboost:       {n_estimators: 300, learning_rate: 0.03, max_depth: 4, min_child_weight: 20,
                  subsample: 0.8, colsample_bytree: 0.7, reg_lambda: 1.0}
  catboost:      {iterations: 300, learning_rate: 0.03, depth: 5, l2_leaf_reg: 3.0}
  random_forest: {n_estimators: 400, max_depth: 6, min_samples_leaf: 30, max_features: 0.4}
  extra_trees:   {n_estimators: 400, max_depth: 6, min_samples_leaf: 30, max_features: 0.4}
  hist_gb:       {max_iter: 300, learning_rate: 0.03, max_depth: 4, min_samples_leaf: 40}
  lstm:          {hidden: 32, layers: 1, dropout: 0.2, epochs: 30, lr: 0.001, window: 60}
  tcn:           {channels: 32, levels: 4, kernel: 3, dropout: 0.2, epochs: 30, lr: 0.001, window: 60}
  quantile_lgbm: {n_estimators: 300, learning_rate: 0.03, num_leaves: 31, min_child_samples: 40}

search_spaces:
  lightgbm:
    n_estimators:      {type: int,      low: 100, high: 800}
    learning_rate:     {type: loguniform, low: 0.005, high: 0.1}
    num_leaves:        {type: int,      low: 7, high: 63}
    min_child_samples: {type: int,      low: 10, high: 100}
    subsample:         {type: uniform,  low: 0.5, high: 1.0}
    colsample_bytree:  {type: uniform,  low: 0.3, high: 1.0}
    reg_lambda:        {type: loguniform, low: 0.01, high: 10.0}
  xgboost:
    n_estimators:      {type: int,      low: 100, high: 800}
    learning_rate:     {type: loguniform, low: 0.005, high: 0.1}
    max_depth:         {type: int,      low: 2, high: 8}
    min_child_weight:  {type: int,      low: 5, high: 60}
    subsample:         {type: uniform,  low: 0.5, high: 1.0}
    colsample_bytree:  {type: uniform,  low: 0.3, high: 1.0}
  elastic_net:
    alpha:             {type: loguniform, low: 1.0e-5, high: 0.1}
    l1_ratio:          {type: uniform,  low: 0.0, high: 1.0}
  logistic_l2:
    C:                 {type: loguniform, low: 0.001, high: 100.0}
