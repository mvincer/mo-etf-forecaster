# Walk-forward geometry, ablation budgets, and model roster.

horizons: [1, 2, 3, 4, 5]

walkforward:
  min_train_bars: 1000        # ~4 years before the first OOS prediction
  refit_every: 21             # trading days between refits
  embargo: horizon            # h-bar embargo between train end and test start
  calibration_frac: 0.15      # tail of each training window reserved for isotonic calibration
  final_holdout_years: 2      # never used for any selection; scored once at the end

ablation:
  base_block: PRICE
  candidate_blocks: [TECH, PATTERN_D1, PATTERN_HTF, REGIME, VOLOPT, SKEW,
                     MACRO_FAST, MACRO_SLOW, EARNINGS, CROSS, SEASON]
  screen_model: lightgbm
  greedy_min_gain: 0.0005     # min OOS log-loss improvement to keep adding a block
  exhaustive_max_blocks: 6    # cap for the 2^k stage
  group_level: true           # stages 1-3 run on the pooled group panel

model_search:
  n_trials: 40                # Optuna trials per (ticker, horizon) in full mode
  n_trials_fast: 0            # fast mode: defaults only, no tuning
  window_grid: [10, 20, 40, 60]   # last-X-candles sweep

models:
  # fast roster used inside the walk-forward at every refit
  fast: [baseline_climatology, logistic_l2, elastic_net, lightgbm, xgboost, random_forest]
  # full roster for the weekly/monthly search
  full: [baseline_climatology, baseline_momentum, logistic_l1, logistic_l2, elastic_net,
         lightgbm, xgboost, catboost, random_forest, extra_trees, hist_gb,
         lstm, tcn]
  ensemble: {top_k: 3, calibration: isotonic}

magnitude:
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  conformal_alpha: 0.20       # 80% conformal band

selection:
  metric: log_loss            # primary champion metric (lower is better)
  tiebreak: brier
  sticky_margin: 0.002        # challenger must beat champion by this to take over
  trailing_window: 500        # OOS observations used for champion scoring

multiple_testing:
  fdr_alpha: 0.10             # Benjamini-Hochberg across ablation cells
  record_trials: true
