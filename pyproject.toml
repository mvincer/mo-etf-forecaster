[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mo-etf-forecaster"
version = "0.1.0"
description = "ETF direction/magnitude forecaster (1-5 day horizons): data lake, options analytics, pattern features, ablation grid search, walk-forward track record."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=14",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    "arch>=6.0",
    "scipy>=1.11",
    "pandas-ta-classic>=0.3",
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[project.optional-dependencies]
full = [
    "xgboost>=2.0",
    "catboost>=1.2",
    "optuna>=3.6",
    "pyvolr>=0.1",
    "ib_insync>=0.9.86",
    "torch>=2.0",
    "exchange_calendars>=4.5",
]

[tool.setuptools.packages.find]
include = ["etf_forecaster*"]
